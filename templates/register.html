{% extends "base.html" %}
{% block title %}Kayıt Ol - Card Checker{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header text-center">
                <i class="fas fa-user-plus fa-2x mb-2" style="color: var(--primary);"></i>
                <h4>Kayıt Ol</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label">Kullanıcı Adı</label>
                        <input type="text" class="form-control" name="username" required placeholder="Kullanıcı adınız">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Telegram ID</label>
                        <input type="text" class="form-control" name="tg_id" required placeholder="Telegram ID'niz">
                        <small class="text-muted">Telegram'dan @userinfobot ile öğrenebilirsiniz</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Telegram Kullanıcı Adı</label>
                        <input type="text" class="form-control" name="tg_username" placeholder="@kullaniciadi (opsiyonel)">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Şifre</label>
                        <input type="password" class="form-control" name="password" required placeholder="Şifreniz">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-user-plus me-2"></i>Kayıt Ol
                    </button>
                </form>
                <hr class="my-4" style="border-color: rgba(255,255,255,0.1);">
                <div class="text-center">
                    <p class="mb-0">Zaten hesabınız var mı? <a href="{{ url_for('login') }}" style="color: var(--primary);">Giriş Yap</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
