{% extends "base.html" %}
{% block title %}Giriş Yap - Card Checker{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header text-center">
                <i class="fas fa-lock fa-2x mb-2" style="color: var(--primary);"></i>
                <h4>Giriş Yap</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label">Kullanıcı Adı / Telegram ID</label>
                        <input type="text" class="form-control" name="username" required placeholder="Kullanıcı adı veya Telegram ID">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Şifre</label>
                        <input type="password" class="form-control" name="password" required placeholder="Şifreniz">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sign-in-alt me-2"></i>Giriş Yap
                    </button>
                </form>
                <hr class="my-4" style="border-color: rgba(255,255,255,0.1);">
                <div class="text-center">
                    <p class="mb-0">Hesabınız yok mu? <a href="{{ url_for('register') }}" style="color: var(--primary);">Kayıt Ol</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
